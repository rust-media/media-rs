[package]
name = "media-codec"
description = "A generic encoding and decoding framework"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/media-codec"
version.workspace = true
authors.workspace = true
license.workspace = true
categories = ["multimedia", "multimedia::audio", "multimedia::video", "multimedia::encoding"]
keywords = ["codec", "encoder", "decoder"]
edition.workspace = true

[dependencies]
ctor.workspace = true
media-codec-h264 = { version = "0.1.0", default-features = false, path = "codecs/h264", optional = true }
media-codec-h265 = { version = "0.1.0", default-features = false, path = "codecs/h265", optional = true }
media-codec-types.workspace = true
media-core.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
media-codec-video-toolbox = { version = "0.1.0", path = "codecs/video-toolbox", optional = true }

[features]
default = ["audio", "video", "decoder", "encoder", "all-codecs"]
all-codecs = ["all-decoders", "all-encoders"]
all-decoders = ["all-audio-decoders", "all-video-decoders"]
all-encoders = ["all-audio-encoders", "all-video-encoders"]
all-audio-decoders = []
all-audio-encoders = []
all-video-decoders = ["h264", "h265", "video-toolbox"]
all-video-encoders = []
audio = [
    "media-core/audio",
    "media-codec-types/audio",
]
video = [
    "media-core/video",
    "media-codec-types/video",
]
decoder = [
    "media-codec-types/decoder",
    "media-codec-h264?/decoder",
    "media-codec-h265?/decoder",
    "media-codec-video-toolbox?/decoder",
]
encoder = [
    "media-codec-types/encoder",
]
# Codecs
h264 = ["dep:media-codec-h264"]
h265 = ["dep:media-codec-h265"]
video-toolbox = ["dep:media-codec-video-toolbox"]
