[package]
name = "media-device-audio-device"
description = "A cross-platform audio capture and playback device implementation"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/media-device-audio-device"
version = "0.1.0"
authors.workspace = true
license.workspace = true
categories = ["multimedia", "multimedia::audio"]
keywords = ["audio", "microphone", "speaker", "capture", "playback"]
edition.workspace = true

[dependencies]
cfg-if.workspace = true
media-core = { workspace = true, features = ["audio"] }
media-device-types = { workspace = true, features = ["audio"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
audio-toolbox.workspace = true
core-audio.workspace = true
core-audio-types.workspace = true
core-foundation.workspace = true
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
]

[features]
default = ["capture", "render", "core-audio"]
capture = ["media-device-types/capture"]
render = ["media-device-types/render"]
core-audio = []

[package.metadata.docs.rs]
default-target = "x86_64-apple-darwin"
targets = [
    "x86_64-apple-darwin",
    "x86_64-apple-ios",
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "x86_64-pc-windows-msvc",
]
